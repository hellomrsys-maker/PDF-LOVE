name: Deploy

# Publishes the site to Cloudflare Workers.
#
# Until this existed, deployment was entirely manual: every push validated
# cleanly and then sat in the repository while the live site served whatever
# was last pushed by hand. That gap is invisible — CI is green, the code is
# merged, and the site is simply old.
#
# Runs only on the repository's default branch, whatever it happens to be
# called. `on.push.branches` cannot express "the default branch", so the
# filter is a job-level condition instead; hardcoding a branch name is what
# left production.yml and release.yml firing on main/master in a repository
# that has neither.
#
# Requires two repository secrets. Without them the job explains what is
# missing and stops, rather than failing with a wall of wrangler output:
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit permission
#   CLOUDFLARE_ACCOUNT_ID  — from the Workers & Pages overview page

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A queued deploy of older code must never land on top of a newer one.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check deploy credentials are configured
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::Deploy skipped — set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generated pages are current
        if: steps.creds.outputs.ready == 'true'
        # Deploying stale generated output would put a site live that does not
        # match its own source. Cheap to check, and it has caught drift before.
        run: |
          python3 scripts/build-seo.py
          python3 scripts/build-legal.py
          if ! git diff --quiet -- frontend; then
            echo "::error::Generated pages are out of date. Run scripts/build-seo.py and scripts/build-legal.py, then commit."
            git diff --stat -- frontend
            exit 1
          fi

      - name: Legal pages carry no placeholders
        if: steps.creds.outputs.ready == 'true'
        # A live privacy policy reading "[TO BE COMPLETED]" gets the site
        # rejected by ad networks and app stores. Never deploy one.
        run: python3 scripts/check-legal.py

      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: What the deployed site actually serves
        if: steps.creds.outputs.ready == 'true'
        # Deploying and serving are different things. Check the real origin
        # immediately, so a broken deploy is caught here rather than by a
        # visitor, or by tomorrow's scheduled production run.
        run: |
          sleep 15
          node scripts/production-check.js --url https://pdflove.co.in
