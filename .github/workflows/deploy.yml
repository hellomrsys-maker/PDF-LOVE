name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: '.'
          # Assets-only Workers (no `main` script, just wrangler.jsonc's
          # `assets.directory`) need Wrangler 4+ — 3.x errors with
          # "Missing entry-point" because it still expects a main script.
          wranglerVersion: '4'
