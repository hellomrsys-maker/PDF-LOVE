name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extract and syntax-check inline script
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('frontend/index.html','utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/)[1];
          fs.writeFileSync('/tmp/extracted.js', script);
          "
          node --check /tmp/extracted.js
      - name: Verify every tool card resolves to a real function
        run: |
          node -e "
          const fs = require('fs');
          const script = fs.readFileSync('/tmp/extracted.js','utf8');
          const fnDefs = new Set([...script.matchAll(/function (tool\w+)\s*\(/g)].map(m=>m[1]));
          const fnRefs = [...script.matchAll(/fn:(tool\w+)[,}]/g)].map(m=>m[1]);
          const wrappedRefs = [...script.matchAll(/fn:\(\)=>(tool\w+)\(/g)].map(m=>m[1]);
          let missing = 0;
          [...fnRefs, ...wrappedRefs].forEach(f => { if(!fnDefs.has(f)){ console.error('MISSING:', f); missing++; } });
          if(missing > 0) process.exit(1);
          console.log('All', fnRefs.length + wrappedRefs.length, 'tool references resolve.');
          "
      - name: Check for duplicate tool names
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('frontend/index.html','utf8');
          const names = [...html.matchAll(/name:'([^']*)'/g)].map(m=>m[1]);
          const seen = {};
          names.forEach(n => seen[n] = (seen[n]||0) + 1);
          const dups = Object.entries(seen).filter(([n,c]) => c > 1);
          if(dups.length > 0){ console.error('Duplicates found:', dups); process.exit(1); }
          console.log(names.length, 'tool names, no duplicates.');
          "

  frontend-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all self-hosted libraries are present and non-empty
        run: |
          for f in pdf-lib.min.js pdf.min.js pdf.worker.min.js jszip.min.js \
                   mammoth.browser.min.js jspdf.umd.min.js html2canvas.min.js \
                   qrcode.min.js jsqr.js jsbarcode.all.min.js qpdf.js qpdf.wasm \
                   qpdf.wasm.b64.js gifenc.min.js xlsx.full.min.js \
                   tesseract/tesseract.min.js tesseract/worker.min.js \
                   tesseract/tesseract-core-simd-lstm.wasm.js \
                   tesseract/tesseract-core-relaxedsimd-lstm.wasm.js \
                   tesseract/tesseract-core-lstm.wasm.js \
                   tesseract/lang/eng.traineddata.gz; do
            test -s "frontend/vendor/$f" || { echo "MISSING: vendor/$f"; exit 1; }
          done
          echo "All 21 vendor assets present."
      - name: Base64 WASM copy matches the real qpdf.wasm
        run: |
          node -e "
          const fs = require('fs');
          const b64 = fs.readFileSync('frontend/vendor/qpdf.wasm.b64.js','utf8').match(/QPDF_WASM_B64 = '([^']+)'/)[1];
          const real = fs.readFileSync('frontend/vendor/qpdf.wasm');
          if(!real.equals(Buffer.from(b64,'base64'))){ console.error('qpdf.wasm.b64.js is stale — regenerate it'); process.exit(1); }
          console.log('qpdf.wasm.b64.js matches qpdf.wasm.');
          "
      - name: Service worker precache list matches vendor directory
        run: |
          node -e "
          const fs = require('fs');
          const sw = fs.readFileSync('frontend/sw.js','utf8');
          // Files intentionally lazy-loaded (not precached) to keep the
          // service worker install under 12 MB. Each must appear in a
          // '// REMOVED:' comment in sw.js so the decision is documented.
          const lazyLoaded = new Set([
            'mammoth.browser.min.js',
            'xlsx.full.min.js',
            'qpdf.wasm.b64.js',
            'qrcode.min.js',
            'jsqr.js',
            'jsbarcode.all.min.js',
          ]);
          const missing = fs.readdirSync('frontend/vendor').filter(f =>
            !lazyLoaded.has(f) && !sw.includes('./vendor/'+f)
          );
          if(missing.length){ console.error('Not precached and not in lazy-load list:', missing); process.exit(1); }
          // Verify every lazy-loaded file has a REMOVED comment in sw.js
          for(const f of lazyLoaded){
            if(!sw.includes(f)) { console.error('Lazy-loaded file not documented in sw.js:', f); process.exit(1); }
          }
          console.log('Vendor assets: precached or documented as lazy-loaded.');
          "

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps for import check
        run: pip install fastapi slowapi uvicorn python-multipart Pillow pikepdf httpx arq pyflakes
      - name: Python syntax check
        run: python3 -m py_compile backend/*.py
      - name: No undefined names (pyflakes)
        run: |
          cd backend
          python3 -m pyflakes --version   # fail loudly rather than silently skipping
          # "imported but unused" is style; undefined names are real bugs.
          python3 -m pyflakes *.py \
            | grep -v 'imported but unused' \
            | grep -v 'redefinition of unused' > /tmp/pyflakes.txt || true
          if [ -s /tmp/pyflakes.txt ]; then echo "pyflakes findings:"; cat /tmp/pyflakes.txt; exit 1; fi
          echo "No undefined names."
      - name: Every backend module imports standalone
        run: |
          # Catches import cycles: the app must not depend on main.py
          # happening to import engines before premium_pdf.
          cd backend
          for m in errors native_ops engines premium_pdf batch_pdf ai_helper worker main; do
            python3 -c "import $m" || { echo "FAILED to import $m standalone"; exit 1; }
            echo "  $m OK"
          done
      - name: Dockerfile copies every module the app imports
        run: |
          python3 - <<'PY'
          import re, pathlib
          df = pathlib.Path("backend/Dockerfile").read_text()
          copied = set()
          for line in df.splitlines():
              if line.startswith("COPY") and line.rstrip().endswith("./"):
                  copied.update(p for p in line.split()[1:-1] if p.endswith(".py"))
          on_disk = {p.name for p in pathlib.Path("backend").glob("*.py")} - {"setup.py"}
          missing = on_disk - copied
          if missing:
              raise SystemExit(f"Dockerfile COPY is missing: {sorted(missing)}")
          print("Dockerfile copies all", len(on_disk), "backend modules.")
          PY
      - name: Compile the native C image kernel
        run: |
          cd backend
          gcc -O3 -shared -fPIC -Wall -Wextra -Werror -o native/imgproc.so native/imgproc.c
      - name: Import check (catches missing imports/decorator errors)
        run: |
          cd backend
          python3 -c "import main; print('Backend app imports cleanly:', main.app.title)"
      - name: C kernel end-to-end test (and Pillow fallback agreement)
        run: |
          cd backend
          python3 - <<'PY'
          import collections
          import native_ops
          from PIL import Image, ImageDraw
          assert native_ops.native_available(), "imgproc.so should load after compile"
          img = Image.new("RGB", (400, 300), (210, 205, 195))
          d = ImageDraw.Draw(img)
          d.text((20, 20), "CI kernel test 0123456789", fill=(60, 55, 50))
          for name, lib in (("C", native_ops._lib), ("fallback", None)):
              native_ops._lib = lib
              out = native_ops.enhance_for_ocr(img)
              c = collections.Counter(out.tobytes())
              assert set(c) <= {0, 255}, f"{name}: not binarized"
              assert c[255] > c[0] > 50, f"{name}: text/background split looks wrong"
              # inverted scans must be flipped back to dark-on-light
              inv = Image.eval(img, lambda v: 255 - v)
              ci = collections.Counter(native_ops.enhance_for_ocr(inv).tobytes())
              assert ci[255] > ci[0], f"{name}: inverted scan not corrected"
              print(name, "path OK")
          PY
      - name: PDF engines end-to-end, with the network hard-blocked
        run: |
          cd backend
          python3 - <<'PY'
          import io, socket, zipfile

          # PDFLove must work air-gapped (README: "no server involved
          # before or after, ever"). Any outbound socket here is a bug.
          class Phoned(Exception): pass
          def deny(*a, **k): raise Phoned("engine attempted a network call")
          socket.socket = deny
          socket.create_connection = deny

          import pikepdf, premium_pdf, batch_pdf
          from errors import EngineError

          def mkpdf(n):
              p = pikepdf.Pdf.new()
              for _ in range(n):
                  p.add_blank_page(page_size=(200, 200))
              b = io.BytesIO(); p.save(b); return b.getvalue()

          def npages(data):
              with pikepdf.open(io.BytesIO(data)) as d:
                  return len(d.pages)

          a, b = mkpdf(2), mkpdf(3)

          out, mt = premium_pdf.run_merge_pdf([a, b])
          assert npages(out) == 5 and mt == "application/pdf", "merge"
          out, mt = premium_pdf.run_split_pdf(a)
          assert len(zipfile.ZipFile(io.BytesIO(out)).namelist()) == 2, "split"
          # a page with no /Rotate key must rotate, not raise
          out, _ = premium_pdf.run_rotate_pdf(a, 90)
          with pikepdf.open(io.BytesIO(out)) as d:
              assert int(d.pages[0].obj.get("/Rotate", 0)) == 90, "rotate"
          out, _ = premium_pdf.run_watermark_pdf(a, mkpdf(1))
          assert npages(out) == 2, "watermark"
          out, _ = premium_pdf.run_split_pdf_range(b, 1, 2)
          assert zipfile.ZipFile(io.BytesIO(out)).namelist(), "split range"
          out, _ = batch_pdf.run_batch_pdf("merge", [a, b])
          assert npages(out) == 5, "batch merge"

          # Bad input must raise EngineError (-> 4xx), never bubble up as a 500.
          for label, fn in (
              ("bad job",     lambda: batch_pdf.run_batch_pdf("nope", [a])),
              ("bad angle",   lambda: premium_pdf.run_rotate_pdf(a, 45)),
              ("corrupt pdf", lambda: premium_pdf.run_rotate_pdf(b"notapdf", 90)),
              ("empty merge", lambda: premium_pdf.run_merge_pdf([])),
          ):
              try:
                  fn()
              except EngineError as e:
                  assert 400 <= e.status < 500, f"{label}: status {e.status}"
              else:
                  raise SystemExit(f"{label}: expected EngineError")

          print("All PDF engines OK offline; error paths return 4xx.")
          PY
      - name: HTTP layer end-to-end
        run: |
          cd backend
          python3 - <<'PY'
          import io, pikepdf
          from fastapi.testclient import TestClient
          import main

          c = TestClient(main.app)

          def mkpdf(n):
              p = pikepdf.Pdf.new()
              for _ in range(n):
                  p.add_blank_page(page_size=(200, 200))
              b = io.BytesIO(); p.save(b); return b.getvalue()

          a, b = mkpdf(2), mkpdf(3)
          pdf = "application/pdf"

          assert c.get("/health").status_code == 200
          assert c.get("/capabilities").status_code == 200

          # /video-process regression guard: it was once nested inside pdfa()
          # after a return, so the route silently did not exist.
          paths = {r.path for r in main.app.routes if hasattr(r, "methods")}
          for p in ("/merge-pdf", "/split-pdf", "/rotate-pdf", "/watermark-pdf",
                    "/batch-pdf", "/video-process", "/ocr", "/convert"):
              assert p in paths, f"route missing: {p}"

          r = c.post("/merge-pdf", files=[("files", ("a.pdf", a, pdf)),
                                          ("files", ("b.pdf", b, pdf))])
          assert r.status_code == 200, r.text
          with pikepdf.open(io.BytesIO(r.content)) as d:
              assert len(d.pages) == 5

          r = c.post("/rotate-pdf", files={"file": ("a.pdf", a, pdf)}, data={"angle": "90"})
          assert r.status_code == 200, r.text
          r = c.post("/split-pdf", files={"file": ("a.pdf", a, pdf)})
          assert r.status_code == 200, r.text
          r = c.post("/watermark-pdf", files={"file": ("a.pdf", a, pdf),
                                              "watermark": ("w.pdf", mkpdf(1), pdf)})
          assert r.status_code == 200, r.text

          # Engine failures must be 4xx, never an unhandled 500.
          for label, r in (
              ("bad batch job", c.post("/batch-pdf", files=[("files", ("a.pdf", a, pdf))],
                                       data={"job": "nope"})),
              ("bad angle",     c.post("/rotate-pdf", files={"file": ("a.pdf", a, pdf)},
                                       data={"angle": "45"})),
              ("corrupt pdf",   c.post("/rotate-pdf", files={"file": ("x.pdf", b"notapdf", pdf)},
                                       data={"angle": "90"})),
          ):
              assert 400 <= r.status_code < 500, f"{label}: got {r.status_code}"

          print("HTTP layer OK: routes registered, failures return 4xx.")
          PY

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          pip install pyyaml
          python3 -c "
          import yaml
          with open('docker-compose.yml') as f:
              data = yaml.safe_load(f)
          assert 'services' in data
          print('Services:', list(data['services'].keys()))
          "
