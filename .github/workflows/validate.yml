name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extract and syntax-check inline script
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('frontend/index.html','utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/)[1];
          fs.writeFileSync('/tmp/extracted.js', script);
          "
          node --check /tmp/extracted.js
      - name: Verify every tool card resolves to a real function
        run: |
          node -e "
          const fs = require('fs');
          const script = fs.readFileSync('/tmp/extracted.js','utf8');
          const fnDefs = new Set([...script.matchAll(/function (tool\w+)\s*\(/g)].map(m=>m[1]));
          const fnRefs = [...script.matchAll(/fn:(tool\w+)[,}]/g)].map(m=>m[1]);
          const wrappedRefs = [...script.matchAll(/fn:\(\)=>(tool\w+)\(/g)].map(m=>m[1]);
          let missing = 0;
          [...fnRefs, ...wrappedRefs].forEach(f => { if(!fnDefs.has(f)){ console.error('MISSING:', f); missing++; } });
          if(missing > 0) process.exit(1);
          console.log('All', fnRefs.length + wrappedRefs.length, 'tool references resolve.');
          "
      - name: Check for duplicate tool names
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('frontend/index.html','utf8');
          const names = [...html.matchAll(/name:'([^']*)'/g)].map(m=>m[1]);
          const seen = {};
          names.forEach(n => seen[n] = (seen[n]||0) + 1);
          const dups = Object.entries(seen).filter(([n,c]) => c > 1);
          if(dups.length > 0){ console.error('Duplicates found:', dups); process.exit(1); }
          console.log(names.length, 'tool names, no duplicates.');
          "

  frontend-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all self-hosted libraries are present and non-empty
        run: |
          for f in pdf-lib.min.js pdf.min.js pdf.worker.min.js jszip.min.js \
                   mammoth.browser.min.js jspdf.umd.min.js html2canvas.min.js \
                   qrcode.min.js jsqr.js jsbarcode.all.min.js qpdf.js qpdf.wasm \
                   qpdf.wasm.b64.js gifenc.min.js; do
            test -s "frontend/vendor/$f" || { echo "MISSING: vendor/$f"; exit 1; }
          done
          echo "All 14 vendor assets present."
      - name: Base64 WASM copy matches the real qpdf.wasm
        run: |
          node -e "
          const fs = require('fs');
          const b64 = fs.readFileSync('frontend/vendor/qpdf.wasm.b64.js','utf8').match(/QPDF_WASM_B64 = '([^']+)'/)[1];
          const real = fs.readFileSync('frontend/vendor/qpdf.wasm');
          if(!real.equals(Buffer.from(b64,'base64'))){ console.error('qpdf.wasm.b64.js is stale — regenerate it'); process.exit(1); }
          console.log('qpdf.wasm.b64.js matches qpdf.wasm.');
          "
      - name: Service worker precache list matches vendor directory
        run: |
          node -e "
          const fs = require('fs');
          const sw = fs.readFileSync('frontend/sw.js','utf8');
          const missing = fs.readdirSync('frontend/vendor').filter(f => !sw.includes('./vendor/'+f));
          if(missing.length){ console.error('Not precached in sw.js:', missing); process.exit(1); }
          console.log('Every vendor asset is precached for offline use.');
          "

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps for import check
        run: pip install fastapi slowapi uvicorn python-multipart Pillow
      - name: Python syntax check
        run: python3 -m py_compile backend/main.py backend/native_ops.py
      - name: Compile the native C image kernel
        run: |
          cd backend
          gcc -O3 -shared -fPIC -Wall -Wextra -Werror -o native/imgproc.so native/imgproc.c
      - name: Import check (catches missing imports/decorator errors)
        run: |
          cd backend
          python3 -c "import main; print('Backend app imports cleanly:', main.app.title)"
      - name: C kernel end-to-end test (and Pillow fallback agreement)
        run: |
          cd backend
          python3 - <<'PY'
          import collections
          import native_ops
          from PIL import Image, ImageDraw
          assert native_ops.native_available(), "imgproc.so should load after compile"
          img = Image.new("RGB", (400, 300), (210, 205, 195))
          d = ImageDraw.Draw(img)
          d.text((20, 20), "CI kernel test 0123456789", fill=(60, 55, 50))
          for name, lib in (("C", native_ops._lib), ("fallback", None)):
              native_ops._lib = lib
              out = native_ops.enhance_for_ocr(img)
              c = collections.Counter(out.tobytes())
              assert set(c) <= {0, 255}, f"{name}: not binarized"
              assert c[255] > c[0] > 50, f"{name}: text/background split looks wrong"
              # inverted scans must be flipped back to dark-on-light
              inv = Image.eval(img, lambda v: 255 - v)
              ci = collections.Counter(native_ops.enhance_for_ocr(inv).tobytes())
              assert ci[255] > ci[0], f"{name}: inverted scan not corrected"
              print(name, "path OK")
          PY

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          pip install pyyaml
          python3 -c "
          import yaml
          with open('docker-compose.yml') as f:
              data = yaml.safe_load(f)
          assert 'services' in data
          print('Services:', list(data['services'].keys()))
          "
