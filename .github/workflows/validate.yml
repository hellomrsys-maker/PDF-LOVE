name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # These three steps used to extract the app out of an inline <script>
      # in index.html. That script was moved to frontend/app.js, the match
      # started returning null, and this job threw a TypeError on every push
      # — which meant app.js, the entire product, had no syntax check at all,
      # and the two checks below silently stopped running. They now read
      # app.js directly, and each one asserts it actually found something, so
      # a pattern that matches nothing fails loudly instead of passing
      # vacuously the way the duplicate-name check did.
      - name: Syntax-check the app
        run: node --check frontend/app.js
      - name: Verify every tool card resolves to a real function
        run: |
          node -e "
          const fs = require('fs');
          const script = fs.readFileSync('frontend/app.js','utf8');
          const fnDefs = new Set([...script.matchAll(/function (tool\w+)\s*\(/g)].map(m=>m[1]));
          const fnRefs = [...script.matchAll(/fn:(tool\w+)[,}]/g)].map(m=>m[1]);
          const wrappedRefs = [...script.matchAll(/fn:\(\)=>(tool\w+)\(/g)].map(m=>m[1]);
          const total = fnRefs.length + wrappedRefs.length;
          if (total < 100) { console.error('Only', total, 'tool references found — the registry pattern has drifted.'); process.exit(1); }
          let missing = 0;
          [...fnRefs, ...wrappedRefs].forEach(f => { if(!fnDefs.has(f)){ console.error('MISSING:', f); missing++; } });
          if(missing > 0) process.exit(1);
          console.log('All', total, 'tool references resolve.');
          "
      - name: Check for duplicate tool names
        run: |
          node -e "
          const fs = require('fs');
          const script = fs.readFileSync('frontend/app.js','utf8');
          // Anchored to the {icon:'...', name:'...'} registry shape. A bare
          // name:'...' also matches a comment describing Emscripten's
          // ExitStatus object, which is not a tool.
          const names = [...script.matchAll(/\{icon:'[^']*',\s*name:'([^']+)'/g)].map(m=>m[1]);
          if (names.length < 100) { console.error('Only', names.length, 'tool names found — the registry pattern has drifted.'); process.exit(1); }
          const seen = {};
          names.forEach(n => seen[n] = (seen[n]||0) + 1);
          const dups = Object.entries(seen).filter(([n,c]) => c > 1);
          if(dups.length > 0){ console.error('Duplicates found:', dups); process.exit(1); }
          console.log(names.length, 'tool names, no duplicates.');
          "
      - name: Every internal link resolves to a real file
        run: |
          python3 - <<'PY'
          import os, re, glob, sys
          os.chdir('frontend')
          bad, checked = [], 0
          files = glob.glob('*.html') + glob.glob('company/*.html') + glob.glob('guides/*.html')
          for f in files:
              base = os.path.dirname(f)
              html = open(f).read()
              # Skip template literals: tools that *generate* HTML for the
              # user (e.g. the favicon generator) embed hrefs that are not
              # this site's links.
              html = re.sub(r'`[^`]*`', '', html, flags=re.S)
              for href in re.findall(r'href="([^"#?]+)"', html):
                  if href.startswith(('http', 'mailto:', 'data:', '//')):
                      continue
                  checked += 1
                  if not os.path.exists(os.path.normpath(os.path.join(base, href))):
                      bad.append(f'{f} -> {href}')
          if bad:
              print('Broken internal links:')
              for b in bad: print('  -', b)
              sys.exit(1)
          print(f'{checked} internal links across {len(files)} pages all resolve.')
          PY

  frontend-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all self-hosted libraries are present and non-empty
        run: |
          for f in pdf-lib.min.js pdf.min.js pdf.worker.min.js jszip.min.js \
                   mammoth.browser.min.js jspdf.umd.min.js html2canvas.min.js \
                   qrcode.min.js jsqr.js jsbarcode.all.min.js qpdf.js qpdf.wasm \
                   qpdf.wasm.b64.js gifenc.min.js xlsx.full.min.js \
                   tesseract/tesseract.min.js tesseract/worker.min.js \
                   tesseract/tesseract-core-simd-lstm.wasm.js \
                   tesseract/tesseract-core-relaxedsimd-lstm.wasm.js \
                   tesseract/tesseract-core-lstm.wasm.js \
                   tesseract/lang/eng.traineddata.gz; do
            test -s "frontend/vendor/$f" || { echo "MISSING: vendor/$f"; exit 1; }
          done
          echo "All 21 vendor assets present."
      - name: Base64 WASM copy matches the real qpdf.wasm
        run: |
          node -e "
          const fs = require('fs');
          const b64 = fs.readFileSync('frontend/vendor/qpdf.wasm.b64.js','utf8').match(/QPDF_WASM_B64 = '([^']+)'/)[1];
          const real = fs.readFileSync('frontend/vendor/qpdf.wasm');
          if(!real.equals(Buffer.from(b64,'base64'))){ console.error('qpdf.wasm.b64.js is stale — regenerate it'); process.exit(1); }
          console.log('qpdf.wasm.b64.js matches qpdf.wasm.');
          "
      - name: Service worker precache list matches vendor directory
        run: |
          node -e "
          const fs = require('fs');
          const sw = fs.readFileSync('frontend/sw.js','utf8');
          const missing = fs.readdirSync('frontend/vendor').filter(f => !sw.includes('./vendor/'+f));
          if(missing.length){ console.error('Not precached in sw.js:', missing); process.exit(1); }
          console.log('Every vendor asset is precached for offline use.');
          "
      - name: Every service-worker precache entry exists on disk
        # The check above only proves vendor/ -> sw.js. This proves the other
        # direction: a precache entry pointing at a file that does not exist
        # would break the install for every user, silently.
        run: |
          node -e "
          const fs = require('fs');
          const sw = fs.readFileSync('frontend/sw.js','utf8');
          const entries = [...sw.matchAll(/'(\.\/[^']+)'/g)].map(m => m[1]).filter(p => p !== './');
          const missing = entries.filter(p => !fs.existsSync('frontend/' + p.replace(/^\.\//,'')));
          if(missing.length){ console.error('Precached but missing on disk:', missing); process.exit(1); }
          console.log(entries.length, 'precache entries all exist on disk.');
          "
      - name: Network surface — no undeclared outbound host
        # The "nothing is uploaded" claim decays silently: someone adds a
        # font, an analytics snippet, a CDN icon set, and nothing visibly
        # breaks — the claim just stops being true. This makes adding a host
        # a deliberate, reviewed act.
        run: node scripts/check-network-surface.js
      - name: SEO pages are regenerable and genuinely distinct
        # Regenerating must be a no-op: if it is not, the committed pages
        # have drifted from the generator (or from the app's tool list, which
        # the generator reads). The audit then fails on any duplicated title,
        # description or canonical — duplication across generated pages is
        # exactly the signal that gets a site penalised.
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 scripts/build-seo.py
          if ! git diff --quiet -- frontend/tools frontend/sitemap.xml frontend/robots.txt; then
            echo "Generated SEO pages are out of date. Run: python scripts/build-seo.py"
            git diff --stat -- frontend/tools frontend/sitemap.xml frontend/robots.txt
            exit 1
          fi
          node scripts/seo-audit.js
      - name: Generated pages are not near-duplicates of each other
        # Unique titles are not the same as unique pages. Every generator
        # here once stamped out one template per family whose only variable
        # was a name, leaving roughly thirty distinct words per page — the
        # profile Google's scaled-content-abuse policy targets, and the
        # commonest reason an AdSense application is refused. The audit above
        # could not see it, because every page had its own title. This
        # measures the body text, within each family, and fails on median
        # 5-gram overlap above 20% or any single pair above 45%.
        run: python3 scripts/check-content-similarity.py
      - name: Canonical host resolves
        # A canonical tag naming a host with no DNS record points every
        # crawler at an address that does not exist. The generator cannot
        # catch it — emitting the tag and resolving it are different things —
        # so check it explicitly before a deploy rather than after indexing.
        run: python3 scripts/check-canonical.py
      - name: Legal pages are regenerable and carry no placeholders
        # A privacy policy reading "[COMPANY LEGAL NAME]" gets a listing
        # rejected by app stores and ad networks, and tells any visitor who
        # reads it that nobody checked. Same no-op-regeneration rule as the
        # SEO pages: if regenerating changes anything, the committed pages
        # have drifted from the generator.
        run: |
          python3 scripts/build-legal.py
          if ! git diff --quiet -- frontend/company; then
            echo "Generated legal pages are out of date. Run: python scripts/build-legal.py"
            git diff --stat -- frontend/company
            exit 1
          fi
          python3 scripts/check-legal.py
      - name: Manifest icons and screenshots exist with the declared sizes
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import json, sys
          from PIL import Image
          mf = json.load(open('frontend/manifest.json'))
          bad = []
          for group in ('icons', 'screenshots'):
              for item in mf.get(group, []):
                  src = item['src']
                  if src.startswith('data:'):
                      continue
                  path = 'frontend/' + src
                  try:
                      im = Image.open(path)
                  except Exception as e:
                      bad.append(f'{src}: {e}')
                      continue
                  actual = f'{im.width}x{im.height}'
                  if actual != item['sizes']:
                      bad.append(f'{src}: declared {item["sizes"]}, actual {actual}')
          if bad:
              print('manifest.json problems:')
              for b in bad: print('  -', b)
              sys.exit(1)
          print('All manifest icons and screenshots exist at their declared sizes.')
          PY

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries for the native extensions
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libqpdf-dev
      - name: Install minimal deps for the import check
        run: pip install fastapi slowapi uvicorn python-multipart Pillow pikepdf arq cryptography setuptools httpx
      - name: Python syntax check — every module, not a subset
        # The previous version compiled only main.py and native_ops.py, which
        # is how a backend that could not import its own entrypoint shipped.
        run: python3 -m py_compile backend/*.py
      - name: Build the fused C/C++ extensions
        run: |
          cd backend
          python3 setup.py build_ext --inplace
          test -f dockbench_imgproc*.so || { echo "dockbench_imgproc did not build"; exit 1; }
          test -f dockbench_pdf*.so     || { echo "dockbench_pdf did not build"; exit 1; }
      - name: The pure C kernel still compiles under -Werror
        run: gcc -O3 -shared -fPIC -Wall -Wextra -Werror -o /tmp/imgproc.so backend/native/imgproc.c
      - name: Every backend module imports standalone
        # Each in its own process, so a module that only works because
        # another happened to be imported first is caught.
        run: |
          cd backend
          for m in errors apikeys engines premium_pdf batch_pdf ai_helper native_ops worker main; do
            UPLOAD_SPOOL_DIR=/tmp/spool python3 -c "import $m" || { echo "FAILED to import $m"; exit 1; }
            echo "  ok: $m"
          done
      - name: App and worker entrypoints load
        run: |
          cd backend
          UPLOAD_SPOOL_DIR=/tmp/spool python3 -c "import main; print('API:', main.app.title, main.app.version)"
          UPLOAD_SPOOL_DIR=/tmp/spool python3 -c "import worker; print('Worker:', worker.WorkerSettings.max_jobs, 'max jobs')"
      - name: Fused extensions agree with their fallbacks
        run: |
          cd backend
          python3 - <<'PY'
          import collections, hashlib, io, sys, zipfile
          import native_ops, premium_pdf as pp, pikepdf
          from PIL import Image, ImageDraw
          from errors import EngineError

          assert native_ops.native_backend() == 'extension', native_ops.native_backend()
          assert pp.pdf_backend() == 'extension', pp.pdf_backend()

          # --- image kernel: extension vs ctypes vs pillow ---------------
          base = Image.new('RGB', (400, 300), (210, 205, 195))
          ImageDraw.Draw(base).text((20, 20), 'CI kernel test 0123456789', fill=(60, 55, 50))
          cases = {'rgb': base, 'rgba': base.convert('RGBA'),
                   'gray': base.convert('L'), 'inverted': Image.eval(base, lambda v: 255 - v)}
          ext = native_ops._ext
          digests = {}
          for label, cfg in (('extension', ext), ('pillow', None)):
              native_ops._ext, native_ops._lib = cfg, None
              for name, im in cases.items():
                  out = native_ops.enhance_for_ocr(im)
                  c = collections.Counter(out.tobytes())
                  assert set(c) <= {0, 255}, f'{label}/{name}: not binarized'
                  assert c[255] > c[0] > 20, f'{label}/{name}: text/background split looks wrong'
                  digests.setdefault(name, {})[label] = hashlib.sha256(out.tobytes()).hexdigest()
          native_ops._ext = ext
          print('  image kernel: extension and pillow fallback both binarize correctly')

          # --- PDF ops: extension vs pikepdf ----------------------------
          src = pikepdf.Pdf.new()
          for _ in range(3): src.add_blank_page(page_size=(612, 792))
          buf = io.BytesIO(); src.save(buf); a = buf.getvalue()
          src2 = pikepdf.Pdf.new()
          for _ in range(2): src2.add_blank_page(page_size=(612, 792))
          buf2 = io.BytesIO(); src2.save(buf2); b = buf2.getvalue()

          real = pp._ext
          for label, cfg in (('extension', real), ('pikepdf', None)):
              pp._ext = cfg
              out, _ = pp.run_merge_pdf([a, b])
              assert len(pikepdf.open(io.BytesIO(out)).pages) == 5, f'{label}: merge'
              out, _ = pp.run_rotate_pdf(a, 90)
              rots = [p.obj.get('/Rotate') for p in pikepdf.open(io.BytesIO(out)).pages]
              assert rots == [90, 90, 90], f'{label}: rotate {rots}'
              out, _ = pp.run_rotate_pdf(out, 90)
              rots = [p.obj.get('/Rotate') for p in pikepdf.open(io.BytesIO(out)).pages]
              assert rots == [180, 180, 180], f'{label}: rotate is not relative {rots}'
              out, _ = pp.run_split_pdf(a)
              assert len(zipfile.ZipFile(io.BytesIO(out)).namelist()) == 3, f'{label}: split'
              out, _ = pp.run_split_pdf_range(a, 2, 3)
              z = zipfile.ZipFile(io.BytesIO(out))
              assert len(pikepdf.open(io.BytesIO(z.read(z.namelist()[0]))).pages) == 2, f'{label}: range'
              out, _ = pp.run_watermark_pdf(a, b)
              assert len(pikepdf.open(io.BytesIO(out)).pages) == 3, f'{label}: watermark'
              # bad input must be 4xx, never an unhandled 500
              for fn in (lambda: pp.run_rotate_pdf(a, 45),
                         lambda: pp.run_merge_pdf([]),
                         lambda: pp.run_rotate_pdf(b'not a pdf', 90),
                         lambda: pp.run_split_pdf_range(a, 1, 99)):
                  try:
                      fn(); raise AssertionError(f'{label}: expected EngineError')
                  except EngineError as e:
                      assert 400 <= e.status < 500, f'{label}: status {e.status}'
              print(f'  pdf ops: {label} path correct')
          pp._ext = real
          PY
      - name: API keys — gating, expiry and tamper resistance
        run: |
          cd backend
          python3 - <<'PY'
          import base64, json, os, subprocess, sys, tempfile
          sys.path.insert(0, '.')
          tmp = tempfile.mkdtemp()
          subprocess.run(['cp', '../licensing/keygen.js', '../licensing/mint-api-key.js', tmp], check=True)
          subprocess.run(['node', 'keygen.js'], cwd=tmp, check=True, capture_output=True)
          def mint(*args):
              out = subprocess.run(['node', 'mint-api-key.js', *args], cwd=tmp,
                                   check=True, capture_output=True, text=True).stdout
              return next(l for l in out.splitlines() if l.startswith('dkb_live_'))
          valid   = mint('--sub=acme', '--expires=2099-01-01')
          expired = mint('--sub=stale', '--expires=2020-01-01')

          os.environ['REQUIRE_API_KEY'] = '1'
          os.environ['DOCKBENCH_API_PUBLIC_KEY_FILE'] = os.path.join(tmp, 'public-key.json')
          import apikeys
          assert apikeys.enabled()
          assert apikeys.verify(valid)['sub'] == 'acme'

          def b64d(s): return base64.urlsafe_b64decode(s + '=' * (-len(s) % 4))
          def b64e(x): return base64.urlsafe_b64encode(x).decode().rstrip('=')
          pl, sig = valid[len('dkb_live_'):].split('.')
          payload = json.loads(b64d(pl))
          forged = dict(payload); forged['sub'] = 'evil'; forged['expires'] = '2099-12-31'
          tampered = 'dkb_live_' + b64e(json.dumps(forged).encode()) + '.' + sig

          for label, key in (('expired', expired), ('tampered payload', tampered),
                             ('bad signature', valid[:-4] + 'AAAA'),
                             ('wrong prefix', valid.replace('dkb_live_', 'dkb_test_')),
                             ('garbage', 'dkb_live_x'), ('empty', '')):
              try:
                  apikeys.verify(key)
                  raise AssertionError(f'{label} was ACCEPTED')
              except apikeys.ApiKeyError:
                  pass
          print('  valid key accepted; expired/tampered/forged/garbage all rejected')

          from fastapi.testclient import TestClient
          os.environ['UPLOAD_SPOOL_DIR'] = '/tmp/spool'
          import main
          c = TestClient(main.app)
          assert c.get('/health').status_code == 200, 'health must stay open'
          assert c.get('/capabilities').status_code == 200, 'capabilities must stay open'
          r = c.post('/compress-pdf', files={'file': ('a.pdf', b'%PDF-1.4')}, data={'level': 'strong'})
          assert r.status_code == 401, f'unkeyed request got {r.status_code}, expected 401'
          r = c.post('/compress-pdf', files={'file': ('a.pdf', b'%PDF-1.4')}, data={'level': 'strong'},
                     headers={'Authorization': 'Bearer ' + valid})
          assert r.status_code != 401, 'valid key was rejected'
          print('  HTTP gate: /health and /capabilities open, processing endpoints 401 without a key')
          PY
      - name: Misconfiguration is fatal, not silently open
        run: |
          cd backend
          if REQUIRE_API_KEY=1 python3 -c "import apikeys" 2>/dev/null; then
            echo "FAIL: REQUIRE_API_KEY=1 with no verifying key should refuse to start"
            exit 1
          fi
          echo "  refuses to start when enforcement is on but no key is configured."
      - name: Streaming capacity — memory must not track file size
        # This is what makes 100 GB documents possible. If someone
        # reintroduces an in-memory path, peak RSS starts scaling with the
        # document and this fails. Scale is modest so it fits a runner's
        # disk; the property being asserted is the same at any size.
        run: python3 scripts/capacity_test.py --scale 3 --pages-per-image 10

  frontend-functional:
    # Drives the real app in a real browser. The static checks above all
    # passed on a build whose backend could not start; this is the job that
    # actually exercises the tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Installed into the workspace, not globally: a global install's
      # location varies by runner image, and hardcoding it breaks the job.
      - run: npm init -y && npm install playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: pip install pikepdf
      - name: Build test PDFs
        run: |
          python3 - <<'PY'
          import pikepdf
          for name, n in (('/tmp/a.pdf', 3), ('/tmp/b.pdf', 2)):
              p = pikepdf.Pdf.new()
              for _ in range(n): p.add_blank_page(page_size=(612, 792))
              p.save(name)
          PY
      - name: Open all 104 tools and run real files through them
        run: |
          cd frontend && python3 -m http.server 5599 &
          sleep 3
          node - <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch();
            const ctx = await browser.newContext({ acceptDownloads: true });
            const page = await ctx.newPage();
            const errs = [];
            page.on('pageerror', e => errs.push(String(e.message)));
            await page.goto('http://localhost:5599/index.html', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1200);

            if (errs.length) { console.error('Load-time errors:', errs); process.exit(1); }

            const names = [...new Set(await page.$$eval('.tool-card',
              els => els.map(e => e.getAttribute('data-tool')).filter(Boolean)))];
            console.log('tool cards in DOM:', names.length);
            if (names.length < 104) { console.error('Expected >= 104 tools'); process.exit(1); }

            // Every on-device tool must open a panel without throwing.
            let opened = 0, failed = [];
            for (const n of names) {
              errs.length = 0;
              try {
                await page.evaluate(() => window.closePanel && window.closePanel());
                await page.waitForTimeout(60);
                await page.locator(`.tool-card[data-tool="${n}"]`).first().click({ timeout: 2500 });
                await page.waitForTimeout(120);
                const ok = await page.evaluate(() =>
                  document.getElementById('overlay')?.classList.contains('open')
                  && document.getElementById('panel-body')?.innerHTML.length > 40);
                if (errs.length) failed.push(`${n}: ${errs[0].slice(0,90)}`);
                else if (ok) opened++;
              } catch (e) {
                // server tools are hidden without a backend; that is expected
                if (!/server|full fidelity|layout-aware|Chat with PDF/i.test(n))
                  failed.push(`${n}: ${String(e.message).split('\n')[0].slice(0,90)}`);
              }
            }
            console.log('panels opened cleanly:', opened);
            if (failed.length) { console.error('Tools that failed to open:'); failed.forEach(f=>console.error('  -',f)); process.exit(1); }

            // Functional: merge and rotate must produce correct PDFs.
            async function run(tool, files, label) {
              await page.evaluate(() => window.closePanel && window.closePanel());
              await page.locator(`.tool-card[data-tool="${tool}"]`).first().click();
              // Wait for the input to actually exist rather than sleeping a
              // fixed interval — a loaded runner is slower than a laptop and
              // a bare waitForTimeout here flakes.
              const input = page.locator('#panel-body input[type=file]').first();
              await input.waitFor({ state: 'attached', timeout: 15000 });
              await input.setInputFiles(files, { timeout: 30000 });
              await page.waitForTimeout(400);
              const dl = page.waitForEvent('download', { timeout: 40000 });
              await page.locator('#panel-body button', { hasText: label }).first().click();
              const d = await dl;
              const out = '/tmp/out-' + d.suggestedFilename();
              await d.saveAs(out);
              return out;
            }
            const merged = await run('Merge PDF', ['/tmp/a.pdf','/tmp/b.pdf'], /merge/i);
            const rotated = await run('Rotate PDF', ['/tmp/a.pdf'], /rotate|download/i);
            fs.writeFileSync('/tmp/outputs.txt', merged + '\n' + rotated + '\n');
            console.log('produced:', merged, rotated);
            await browser.close();
          })();
          JS
      - name: Verify the produced PDFs are correct
        run: |
          python3 - <<'PY'
          import pikepdf
          merged, rotated = open('/tmp/outputs.txt').read().split()
          m = pikepdf.open(merged)
          assert len(m.pages) == 5, f'merge produced {len(m.pages)} pages, expected 5'
          r = pikepdf.open(rotated)
          rots = [p.obj.get('/Rotate') for p in r.pages]
          assert rots == [90, 90, 90], f'rotate produced {rots}'
          print(f'merge -> {len(m.pages)} pages, rotate -> {rots}. Both correct.')
          PY

      - name: Every tool, driven with real files and its output inspected
        # The step above proves a panel opens; this proves the tool works.
        # Each one is given a real fixture, driven to its output, and the
        # output opened and checked — that Search & Redact removed the SSN
        # from the text layer rather than covering it, that Protect PDF
        # rejects a wrong password, that the EXIF stripper dropped GPS.
        run: |
          # pdfminer.six is not optional: without it the redaction and OCR
          # checkers cannot read a PDF text layer, and both failed on every
          # push while the tools themselves were fine.
          pip install --quiet pikepdf pillow reportlab piexif python-docx openpyxl python-pptx pdfminer.six
          python3 scripts/make-fixtures.py
          node scripts/make-media-fixture.js
          PYTHON=python3 node scripts/functional-suite.js
      - name: Tools work on their own pages, not just in the modal
        # functional-suite.js loads index.html and scopes every selector to
        # #panel-body. The 149 /tools/*.html pages render into
        # #panel-body-mount instead, so that suite could pass while every
        # one of them was broken — and those pages are where search traffic
        # lands. This drives real files through them and checks the mount
        # latch still hands a second tool to the modal.
        run: node scripts/page-native-test.js
      - name: Keyboard and screen-reader access to the tools
        # Every tool worked, for anyone using a mouse. The favourite star was
        # a <span role="button"> with no tabindex — announced as a button and
        # not in the tab order. The file dropzone was a bare <div>, so the
        # first step of nearly every tool was unreachable without a mouse.
        # And all 138 form controls relied on an adjacent <label> carrying no
        # `for`, or on a placeholder, which is a hint and not a name. None of
        # it showed up in a functional suite that drives the page by
        # selector, so this checks it directly.
        run: node scripts/check-a11y.js
      - name: The test report reflects what the suites actually measured
        # TEST_REPORT.md claimed "86 of 86 passed" while the suite was
        # failing on every push. It could not self-correct because nothing
        # regenerated it. Now it does, and a stale committed copy fails here
        # rather than sitting in the repository saying something untrue.
        run: |
          python3 scripts/build-report.py
          # The header carries a generation timestamp and the commit hash,
          # both of which change on every run by design. Compare everything
          # else — a plain `git diff --quiet` here would always fail.
          if ! diff <(git show HEAD:TEST_REPORT.md | grep -v '^Generated ') \
                    <(grep -v '^Generated ' TEST_REPORT.md) > /dev/null; then
            echo "::error::TEST_REPORT.md is out of date. Run: python scripts/build-report.py"
            diff <(git show HEAD:TEST_REPORT.md | grep -v '^Generated ') \
                 <(grep -v '^Generated ' TEST_REPORT.md) | head -40
            exit 1
          fi
      - name: Published tool counts match the app
        # The docs claimed 97 on-device tools while the app shipped 94,
        # because three server-assisted converters sat in an always-visible
        # row. Nothing checked it, so the claim drifted and stayed wrong.
        run: node scripts/check-tool-counts.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-results
          path: test-results/functional.json
          if-no-files-found: ignore

      - name: The minified build still works
        # frontend/dist is what ships inside the desktop app and the APK. A
        # minifier that produces parseable-but-broken output would ship a
        # dead app to every installed user while the website stayed fine, so
        # this runs the same functional checks against dist.
        run: |
          node build.mjs
          # The app's logic lives in app.js, not in an inline <script>, since
          # it was extracted so the standalone /tools/*.html pages could share
          # it. This step still looked for the inline script — and the failure
          # was invisible, because `node --check <(node -e ...)` reports the
          # status of node --check, which succeeds on the empty file that a
          # crashed inner command leaves behind. A fourth dead step.
          node -e "
            const fs=require('fs');
            const src=fs.readFileSync('frontend/dist/app.js','utf8');
            if(src.length < 100000)
              throw new Error('dist/app.js is '+src.length+' bytes — minification produced a stub');
            if(!/toolMergePDF/.test(src))
              throw new Error('dist/app.js does not contain the tool definitions');
            console.log('  dist/app.js is '+src.length+' bytes and carries the tools');
          "
          node --check frontend/dist/app.js && echo "  minified app.js parses"
          node --check frontend/dist/sw.js
          node -e "
            const fs=require('fs');
            const h=fs.readFileSync('frontend/dist/index.html','utf8');
            [...h.matchAll(/application\/ld\+json\">([\s\S]*?)<\/script>/g)]
              .forEach(m => JSON.parse(m[1]));
            console.log('  JSON-LD survived minification');
          "
          cd frontend/dist && python3 -m http.server 5601 &
          sleep 3
          node - <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ acceptDownloads: true });
            const p = await ctx.newPage();
            const errs = [];
            p.on('pageerror', e => errs.push(String(e.message)));
            await p.goto('http://localhost:5601/index.html', { waitUntil: 'networkidle' });
            await p.waitForTimeout(1200);
            if (errs.length) { console.error('minified build errors:', errs); process.exit(1); }

            const n = (await p.$$eval('.tool-card', e =>
              [...new Set(e.map(x => x.getAttribute('data-tool')).filter(Boolean))])).length;
            if (n < 104) { console.error('minified build rendered', n, 'tools'); process.exit(1); }

            // Real work, not just rendering.
            await p.locator('.tool-card[data-tool="Merge PDF"]').first().click();
            const input = p.locator('#panel-body input[type=file]').first();
            await input.waitFor({ state: 'attached', timeout: 15000 });
            await input.setInputFiles(['/tmp/a.pdf', '/tmp/b.pdf'], { timeout: 30000 });
            await p.waitForTimeout(500);
            const dl = p.waitForEvent('download', { timeout: 40000 });
            await p.locator('#panel-body button', { hasText: /merge/i }).first().click();
            await (await dl).saveAs('/tmp/dist-merged.pdf');

            // ?tool= deep links are how every SEO page enters the app.
            await p.goto('http://localhost:5601/index.html?tool=Merge%20PDF', { waitUntil: 'networkidle' });
            await p.waitForTimeout(700);
            const title = await p.evaluate(() => document.querySelector('#panel h2')?.textContent);
            if (title !== 'Merge PDF') { console.error('deep link broken in dist:', title); process.exit(1); }

            console.log(`  minified build: ${n} tools, merge produced output, deep links work`);
            await b.close();
          })();
          JS
          python3 -c "
          import pikepdf
          p = pikepdf.open('/tmp/dist-merged.pdf')
          assert len(p.pages) == 5, f'minified build produced {len(p.pages)} pages'
          print('  minified build merge -> 5 pages, correct')
          "

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          pip install pyyaml
          python3 - <<'PY'
          import yaml, sys
          data = yaml.safe_load(open('docker-compose.yml'))
          assert 'services' in data
          print('Services:', list(data['services'].keys()))

          # The API spools large uploads to disk and hands the worker a path.
          # If that directory is not a volume shared by both, the worker can
          # never read it — each container has its own private tmpfs at /tmp.
          be, wk = data['services']['backend'], data['services']['worker']
          def vols(s): return {v.split(':')[0] for v in s.get('volumes', [])}
          shared = vols(be) & vols(wk)
          assert shared, 'backend and worker share no volume for the upload spool'
          named = set(data.get('volumes') or {})
          assert shared & named, f'upload spool {shared} is not a declared named volume'
          print('Shared upload spool volume:', shared & named)
          PY
