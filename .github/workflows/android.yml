name: Android

# Builds the Android app. The entire web application is bundled into the
# APK (see android/README.md) — it is not a TWA and makes no network
# request to load itself.
#
#   push to a v* tag -> signed APK + AAB attached to the release
#   pull request     -> debug build, to catch compile breaks early
#   manual dispatch  -> artifacts

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - 'android/**'
      - 'frontend/**'
      - 'scripts/build-android-assets.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow (launcher icon generation)
        run: pip install pillow

      - name: Build the minified web bundle
        run: npm ci --omit=dev || npm install --omit=dev; node build.mjs

      - name: Stage the web app into the APK assets
        run: python scripts/build-android-assets.py

      - name: Assets must actually be present
        # A silently empty assets/www would produce an APK that opens to a
        # blank screen — the failure a user would see first.
        run: |
          test -f android/app/src/main/assets/www/index.html \
            || { echo "index.html missing from APK assets"; exit 1; }
          test -d android/app/src/main/assets/www/vendor \
            || { echo "vendor/ missing from APK assets"; exit 1; }
          echo "staged $(du -sh android/app/src/main/assets/www | cut -f1) of web assets"

      - name: Decode the signing keystore
        # Absent on pull requests and forks; the build then produces an
        # unsigned APK rather than failing.
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pdflove.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pdflove.keystore" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew 2>/dev/null || gradle wrapper
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease bundleRelease --no-daemon
          fi

      - name: Report what was built
        run: |
          find android/app/build/outputs -name '*.apk' -o -name '*.aab' | while read f; do
            echo "$(du -h "$f" | cut -f1)  $f"
          done

      # An APK that builds is not an APK that works. Boot a real emulator,
      # install it, and check the claims the bundled-assets architecture
      # makes — chiefly that it runs with the network switched off, from a
      # cold start, because the whole app is on the device.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and test on an emulator, online then in airplane mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # A snapshot would restore a warm state and hide exactly the
          # cold-start behaviour being tested.
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android-emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdflove-android-emulator-logs
          path: |
            /tmp/android-test/*.txt
            /tmp/android-test/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: pdflove-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Publish SHA-256 checksums for the APK and bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          shasum -a 256 android/app/build/outputs/apk/release/*.apk \
                        android/app/build/outputs/bundle/release/*.aab |
            sed 's| .*/| |' > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SHA256SUMS-android.txt
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
