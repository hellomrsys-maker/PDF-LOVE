name: Release

# Builds and publishes ready-to-run images to GitHub Container Registry:
#   ghcr.io/hellomrsys-maker/dockbench-frontend
#   ghcr.io/hellomrsys-maker/dockbench-backend
#
# - every push to the default branch  -> :latest
# - every v* tag                      -> :vX.Y.Z (+ :latest) and a GitHub
#   Release carrying dockbench-offline.zip (the double-click bundle)
#
# Deploying then becomes `docker compose pull && docker compose up -d`
# on the server — no build resources needed there.

on:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dockbench-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

  offline-bundle:
    # The frontend folder IS the offline app — zip it and attach it to
    # the release so non-technical users can download & double-click.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - name: Build offline bundle
        run: |
          cd frontend
          # icons/ and guides/ were previously omitted, so every manifest
          # icon 404'd and the help pages were missing from the download.
          zip -r ../dockbench-offline.zip \
            index.html manifest.json sw.js vendor/ icons/ guides/ company/
          cd ..
          unzip -l dockbench-offline.zip | tail -3
      - name: Verify the bundle is self-contained
        run: |
          python3 - <<'PY'
          import zipfile, re, sys
          z = zipfile.ZipFile('dockbench-offline.zip')
          names = set(z.namelist())
          missing = []
          # every asset the service worker promises to precache must be in here
          sw = z.read('sw.js').decode()
          for path in re.findall(r"'\./([^']+)'", sw):
              if path and path not in names:
                  missing.append('sw precache: ' + path)
          # every icon the manifest references
          import json
          mf = json.loads(z.read('manifest.json'))
          for icon in mf.get('icons', []):
              src = icon['src']
              if not src.startswith('data:') and src not in names:
                  missing.append('manifest icon: ' + src)
          if missing:
              print('Bundle is missing files referenced by the app:')
              for m in missing: print('  -', m)
              sys.exit(1)
          print(f'Bundle OK: {len(names)} files, nothing dangling.')
          PY
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dockbench-offline.zip
          generate_release_notes: true
