# Production nginx config for the PDFLove frontend.
# Serves the static app with sane caching + security headers, and proxies
# /api/* to the backend so the browser only ever talks to one origin
# (avoids CORS entirely in production).
#
# Listens on 8080: the image is nginx-unprivileged (non-root). In the
# "prod" compose profile, Caddy terminates TLS in front of this.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — reasonable defaults for a static, no-account app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
    # Content-Security-Policy, explained:
    #   script-src  'self' + 'unsafe-inline' (the app is one inline script)
    #               + the two pinned CDN fallbacks + blob: (workers)
    #               + Google AdSense's loader (AD_CONFIG.adsense in
    #                 index.html — banner + result slots; both require a
    #                 real Ad unit ID from the AdSense dashboard before they
    #                 render anything, see the TODOs next to AD_CONFIG)
    #   connect-src 'self' + data:/blob: (WASM, canvas exports)
    #               + frankfurter.dev (the one live-data tool: FX rates)
    #               + jsdelivr/HuggingFace (on-device AI model downloads)
    #               + AdSense's own beaconing/reporting endpoints
    #   img/media/font allow data:/blob: for generated previews and videos;
    #               img-src also allows AdSense's creative-serving domains.
    #   frame-src   'self' + AdSense's ad-rendering iframes (doubleclick /
    #               googlesyndication / google.com — Google serves the
    #               actual creative in a sandboxed cross-origin iframe).
    #   For the rewarded slot specifically (AD_CONFIG.rewarded, still
    #   disabled), a web-native rewarded-video network (e.g. AppLixir) pays
    #   far better than a banner — $4-15 CPM vs $0.50-2 — and unlike
    #   Google's own "AdSense for Video" has no 2M-monthly-impression /
    #   40%-video-content minimum, which a tool site never hits. Add its
    #   domains here the same way if you turn it on.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://www.googletagservices.com https://tpc.googlesyndication.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://www.google.com https://*.googlesyndication.com; media-src 'self' blob: mediastream:; font-src 'self' data:; connect-src 'self' data: blob: https://api.frankfurter.dev https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://www.google.com; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://pagead2.googlesyndication.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Caching via `expires` (not add_header: an add_header inside a
    # location silently discards every server-level header above,
    # including the CSP — a classic nginx foot-gun).
    # App shell: never cache, so updates reach users promptly (the
    # service worker handles offline caching instead).
    location = /index.html { expires -1; }
    location = /manifest.json { expires -1; }
    location = /sw.js { expires -1; }

    # Vendor assets are version-pinned files; cache aggressively.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|woff2?|wasm)$ {
        expires 365d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container so the browser stays
    # same-origin — set this up if you deploy frontend+backend together.
    # Comment out if you're pointing the frontend at a different domain
    # for the backend (and set ALLOWED_ORIGINS there instead).
    # Metrics are for your monitoring system, not the public internet —
    # scrape backend:8000/metrics directly on the compose network instead.
    location = /api/metrics { return 403; }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 200s;
        client_max_body_size 60M;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
