# Production nginx config for the Dockbench frontend.
# Serves the static app with sane caching + security headers, and proxies
# /api/* to the backend so the browser only ever talks to one origin
# (avoids CORS entirely in production).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — reasonable defaults for a static, no-account app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # The app shell itself: never cache the HTML so updates always reach
    # users promptly (the service worker handles offline caching instead).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Everything else (if you add hashed static assets later) can be
    # cached aggressively since a filename change invalidates the cache.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container so the browser stays
    # same-origin — set this up if you deploy frontend+backend together.
    # Comment out if you're pointing the frontend at a different domain
    # for the backend (and set ALLOWED_ORIGINS there instead).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 200s;
        client_max_body_size 60M;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
